version: '3.9'

services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: sgai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgai
      POSTGRES_PASSWORD: sgai
      POSTGRES_DB: sgai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sgai-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgai']
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicação Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: sgai_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sgai:sgai@db:5432/sgai
      NEXTAUTH_SECRET: dev_secret_change_in_production
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      UPLOAD_DIR: /tmp/uploads
      CRON_SECRET: ${CRON_SECRET:-dev_cron_secret}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Necessário para hot-reload funcionar corretamente no WSL2
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      # Monta o código local para hot-reload
      - .:/app
      # Evita sobrescrever node_modules do container
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run db:migrate && npm run seed && npm run dev"
    networks:
      - sgai-net

volumes:
  pgdata:
    driver: local

networks:
  sgai-net:
    driver: bridge
